name: refresh archive index

on:
  schedule:
    - cron: "20 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install marketlens pyarrow
      - run: python tools/build.py --index
        env:
          MARKETLENS_API_KEY: ${{ secrets.MARKETLENS_API_KEY }}
      - run: |
          if git diff --quiet -- archive-index.csv; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "marketlens"
          git config user.email "ops@marketlens.trade"
          git add archive-index.csv
          git commit -m "refresh archive index"
          git push
